name: Build OpenWrt Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target architecture to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'ramips-mt7621-23.05.3'
          - 'ramips-mt7621-25.12.2'
          - 'mediatek-filogic-25.12.2'
          - 'ath79-generic-23.05.3'
          - 'ath79-generic-25.12.2'
          - 'x86-64-25.12.2'
          - 'qualcommax-ipq807x-25.12.2'
          - 'qualcommax-ipq60xx-25.12.2'
          - 'bcm27xx-bcm2711-25.12.2'

jobs:
  prepare-matrix:
    name: Determine Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          ALL_ARCHES='[
            "ramips-mt7621-23.05.3",
            "ramips-mt7621-25.12.2",
            "mediatek-filogic-25.12.2",
            "ath79-generic-23.05.3",
            "ath79-generic-25.12.2",
            "x86-64-25.12.2",
            "qualcommax-ipq807x-25.12.2",
            "qualcommax-ipq60xx-25.12.2",
            "bcm27xx-bcm2711-25.12.2"
          ]'
          CHOSEN="${{ inputs.target_arch }}"
          if [ -z "$CHOSEN" ] || [ "$CHOSEN" = "all" ]; then
            echo "matrix={\"arch\": $(echo $ALL_ARCHES | tr -d '\n ')}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"arch\": [\"$CHOSEN\"]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build for ${{ matrix.arch }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Package via OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: typesizes
          FEED_DIR: ${{ github.workspace }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typesizes-binaries-${{ matrix.arch }}
          path: bin/packages/**/typesizes*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Filtered Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: typesizes-binaries-*
          path: artifacts
          merge-multiple: false

      - name: Prepare Release Assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Downloaded artifacts are isolated in: artifacts/typesizes-binaries-<target>-<version>/...
          # Extract the base target name (without the SDK version number) for clean minimalist filenames:
          # e.g. typesizes-binaries-ramips-mt7621-23.05.3 -> ramips-mt7621
          # Resulting in: typesizes_ramips-mt7621.ipk, typesizes_ramips-mt7621.apk, etc.
          for dir in artifacts/typesizes-binaries-*; do
            [ -d "$dir" ] || continue
            FOLDER_NAME=$(basename "$dir")
            # Strip prefix "typesizes-binaries-" and trailing OpenWrt release "-23.05.3" / "-25.12.2"
            TARGET=$(echo "$FOLDER_NAME" | sed -E 's/^typesizes-binaries-//; s/-[0-9]+\.[0-9]+(\.[0-9]+)?(-rc[0-9]+)?$//')

            # Copy .ipk packages
            while IFS= read -r -d '' file; do
              echo "Packaging IPK: $file -> release-assets/typesizes_${TARGET}.ipk"
              cp "$file" "release-assets/typesizes_${TARGET}.ipk"
            done < <(find "$dir" -type f -name "typesizes*.ipk" -print0)

            # Copy .apk packages
            while IFS= read -r -d '' file; do
              echo "Packaging APK: $file -> release-assets/typesizes_${TARGET}.apk"
              cp "$file" "release-assets/typesizes_${TARGET}.apk"
            done < <(find "$dir" -type f -name "typesizes*.apk" -print0)
          done

          echo "=== Prepared Release Assets ==="
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
